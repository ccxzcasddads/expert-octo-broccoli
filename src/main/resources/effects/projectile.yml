# ╔════════════════════════════════════════════════════════════════════╗
# ║                AppleCosmetic — эффекты снарядов                    ║
# ╚════════════════════════════════════════════════════════════════════╝
# След из спрайтов тянется за стрелами и другими снарядами игрока, пока они летят,
# а при попадании можно показать вспышку. Список снарядов задаётся
# в config.yml → effects.projectile.types.
#
# Поля эффекта:
#   name        — название в меню
#   icon        — иконка в меню (форматы предметов описаны в config.yml)
#   lore        — описание в меню
#   permission  — право доступа; по умолчанию applecosmetic.projectile.<id>,
#                 пустая строка "" делает эффект доступным всем
#   trail       — настройки следа
#   layers      — необязательно: слои спрайтов в точке попадания (параметры — в effects/kill.yml;
#                 точка отсчёта — место попадания, поэтому y-offset обычно 0)
#   sounds      — необязательно: звуки при попадании
#
# Параметры следа:
#   sprite      — спрайт или список спрайтов (для каждой точки следа выбирается случайный);
#                 названия встроенных — на листе docs/preview/sprites.png
#   size        — размер в блоках; "0.3-0.45" — случайный в этих пределах
#   duration    — сколько тиков живёт каждый спрайт следа (он постепенно сжимается)
#   spacing     — расстояние между спрайтами вдоль траектории, в блоках
#   spread      — случайный разброс вокруг траектории
#   spiral      — радиус спирали вокруг траектории; 0 — прямой след
#   rise        — на сколько блоков спрайт всплывает (или тонет, если число отрицательное)
#   spin        — вращение, градусов за тик
#   color       — окраска "#RRGGBB" для белых спрайтов
#   rainbow     — true: след переливается всеми цветами по порядку

# Служебная версия файла — не меняйте. Когда формат обновляется, плагин сохраняет
# прежний файл рядом как projectile.yml.vN.bak и кладёт на его место новый.
file-version: 2

effects:
  flame:
    name: "<gradient:#ffb347:#ff5f1f>Огненный след</gradient>"
    icon: "model:applecosmetic:gui/projectile_flame"
    lore:
      - "<#b5838a>Стрела оставляет языки пламени."
    trail: { sprite: flame_orange, size: "0.35-0.5", duration: 9, spacing: 0.7, spread: 0.05, rise: 0.25 }
    layers:
      - { animation: POP, sprite: impact_orange, size: 1.0, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: [flame_orange, spark_orange], amount: 6, radius: 0.8, size: 0.32, duration: 10, y-offset: 0 }

  soul_flame:
    name: "<gradient:#7df9ff:#3aa6b9>Пламя душ</gradient>"
    icon: "model:applecosmetic:gui/projectile_soul_flame"
    lore:
      - "<#b5838a>Холодный голубой огонь."
    trail: { sprite: flame_teal, size: "0.35-0.5", duration: 9, spacing: 0.7, spread: 0.05, rise: 0.25 }
    layers:
      - { animation: POP, sprite: impact_teal, size: 1.0, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: [flame_teal, glint_teal], amount: 6, radius: 0.8, size: 0.32, duration: 10, y-offset: 0 }

  copper_flame:
    name: "<gradient:#a8ff78:#3bb78f>Медное пламя</gradient>"
    icon: "model:applecosmetic:gui/projectile_copper_flame"
    lore:
      - "<#b5838a>Зелёный огонь медного факела."
    trail: { sprite: flame_green, size: "0.35-0.5", duration: 9, spacing: 0.7, spread: 0.05, rise: 0.25 }
    layers:
      - { animation: POP, sprite: impact_green, size: 1.0, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: [flame_green, glint_lime], amount: 6, radius: 0.8, size: 0.32, duration: 10, y-offset: 0 }

  love:
    name: "<gradient:#ff8fab:#ff2e4d>Стрела амура</gradient>"
    icon: "model:applecosmetic:gui/projectile_love"
    lore:
      - "<#b5838a>Сердечки летят вслед за стрелой."
    trail: { sprite: [heart_red, heart_pink], size: "0.3-0.42", duration: 12, spacing: 0.9, spread: 0.08, rise: 0.3 }
    layers:
      - { animation: POP, sprite: heart_red, size: 0.9, duration: 10, y-offset: 0.2 }
      - { animation: BURST, sprite: [heart_pink, heart_red], amount: 5, radius: 0.8, size: 0.28, duration: 12, y-offset: 0 }

  melody:
    name: "<gradient:#a8ff78:#78ffd6>Музыкальная стрела</gradient>"
    icon: "model:applecosmetic:gui/projectile_melody"
    lore:
      - "<#b5838a>За стрелой тянутся ноты."
    trail: { sprite: [note_pink, note2_teal, note_gold, note2_lime, note_purple], size: 0.4, duration: 12, spacing: 1.0, spread: 0.1, rise: 0.35 }
    sounds:
      - { name: block.note_block.chime, volume: 0.7, pitch: 1.4 }
    layers:
      - { animation: RISE, sprite: [note2_pink, note_teal, note2_gold], amount: 3, radius: 0.4, height: 0.8, size: 0.42, duration: 14, y-offset: 0, interval: 1 }

  rainbow:
    name: "<rainbow>Радужный след</rainbow>"
    icon: "model:applecosmetic:gui/projectile_rainbow"
    lore:
      - "<#b5838a>След переливается всеми цветами."
    trail: { sprite: orb_white, rainbow: true, size: 0.32, duration: 12, spacing: 0.45 }
    layers:
      - { animation: BURST, sprite: spark_white, rainbow: true, amount: 8, radius: 0.9, size: 0.32, duration: 12, y-offset: 0 }

  frost:
    name: "<gradient:#e0f7ff:#7de8ff>Ледяной след</gradient>"
    icon: "model:applecosmetic:gui/projectile_frost"
    lore:
      - "<#b5838a>Снежинки кружат за стрелой."
    trail: { sprite: [snow_ice, snow_white, shard_ice], size: "0.3-0.42", duration: 11, spacing: 0.8, spread: 0.1, rise: -0.3, spin: 6 }
    layers:
      - { animation: POP, sprite: impact_ice, size: 1.0, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: shard_ice, amount: 6, radius: 0.8, size: 0.32, duration: 10, y-offset: 0, fall: 0.4, spin: 10 }

  stars:
    name: "<gradient:#ffffff:#ffe9a8>Звёздная спираль</gradient>"
    icon: "model:applecosmetic:gui/projectile_stars"
    lore:
      - "<#b5838a>Искры закручиваются вокруг стрелы."
    trail: { sprite: [star_gold, glint_gold, star_white], size: 0.36, duration: 10, spacing: 0.6, spiral: 0.35, spin: 10 }
    layers:
      - { animation: BURST, sprite: [star_gold, glint_gold], amount: 6, radius: 0.9, size: 0.32, duration: 12, y-offset: 0, spin: 14 }

  slime:
    name: "<gradient:#a8ff78:#56ab2f>Слизневый след</gradient>"
    icon: "model:applecosmetic:gui/projectile_slime"
    lore:
      - "<#b5838a>Липко, зато заметно."
    trail: { sprite: [drop_lime, dot_lime], size: 0.36, duration: 12, spacing: 0.8, rise: -0.6 }
    sounds:
      - { name: entity.slime.squish_small, volume: 0.8, pitch: 1.2 }
    layers:
      - { animation: POP, sprite: splat_lime, size: 1.1, duration: 10, y-offset: 0 }

  sakura:
    name: "<gradient:#ffd1dc:#ff8fab>Лепестки сакуры</gradient>"
    icon: "model:applecosmetic:gui/projectile_sakura"
    lore:
      - "<#b5838a>Лепестки осыпаются вдоль пути стрелы."
    trail: { sprite: [petal_pink, petal_white], size: 0.36, duration: 14, spacing: 0.8, spread: 0.12, rise: -0.5, spin: 8 }
    layers:
      - { animation: BURST, sprite: [petal_pink, petal_white], amount: 7, radius: 0.9, size: 0.32, duration: 14, y-offset: 0, fall: 0.6, spin: 10 }

  witch:
    name: "<gradient:#c77dff:#5a189a>Ведьмина пыльца</gradient>"
    icon: "model:applecosmetic:gui/projectile_witch"
    lore:
      - "<#b5838a>Фиолетовые искры колдовства."
    trail: { sprite: [spark_purple, glint_pink, puff_purple], size: "0.3-0.42", duration: 10, spacing: 0.6, spread: 0.08 }
    layers:
      - { animation: POP, sprite: impact_purple, size: 1.0, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: [spark_purple, glint_pink], amount: 6, radius: 0.8, size: 0.3, duration: 10, y-offset: 0 }

  runes:
    name: "<gradient:#d39bff:#7df9ff>Древние руны</gradient>"
    icon: "model:applecosmetic:gui/projectile_runes"
    lore:
      - "<#b5838a>Символы стола зачарований."
    trail: { sprite: [rune_a_teal, rune_b_teal, rune_c_teal, rune_a_purple, rune_c_purple], size: 0.4, duration: 12, spacing: 1.0, spread: 0.05 }
    layers:
      - { animation: ORBIT, sprite: [rune_a_teal, rune_b_purple, rune_c_teal], amount: 3, radius: 0.6, turns: 1, duration: 14, size: 0.36, y-offset: 0 }

  shock:
    name: "<gradient:#fff59d:#ffd54f>Грозовой разряд</gradient>"
    icon: "model:applecosmetic:gui/projectile_shock"
    lore:
      - "<#b5838a>Стрела искрит в полёте."
    trail: { sprite: [bolt_gold, glint_gold, bolt_white], size: 0.4, duration: 7, spacing: 0.7, spread: 0.12 }
    layers:
      - { animation: POP, sprite: impact_gold, size: 1.1, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: bolt_gold, amount: 5, radius: 0.9, size: 0.36, duration: 9, y-offset: 0, spin: 20 }

  emerald:
    name: "<gradient:#a8ff78:#17c964>Изумрудная пыль</gradient>"
    icon: "model:applecosmetic:gui/projectile_emerald"
    lore:
      - "<#b5838a>Зелёные искры удачи."
    trail: { sprite: [gem_green, glint_lime, spark_green], size: 0.34, duration: 10, spacing: 0.7, spread: 0.06 }
    layers:
      - { animation: BURST, sprite: [gem_green, spark_green], amount: 6, radius: 0.8, size: 0.3, duration: 12, y-offset: 0, fall: 0.5 }
