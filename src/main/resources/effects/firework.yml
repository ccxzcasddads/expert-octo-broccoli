# ╔════════════════════════════════════════════════════════════════════╗
# ║               AppleCosmetic — эффекты фейерверков                  ║
# ╚════════════════════════════════════════════════════════════════════╝
# След из спрайтов тянется за ракетой фейерверка, которую запустил игрок: с земли,
# из арбалета или для разгона на элитрах (тогда след остаётся за самим игроком).
# Когда ракета гаснет или взрывается, на этом месте появляется вспышка из спрайтов.
# Что из этого включено, задаётся в config.yml → effects.firework.
#
# Поля эффекта:
#   name        — название в меню
#   icon        — иконка в меню (форматы предметов описаны в config.yml)
#   lore        — описание в меню
#   permission  — право доступа; по умолчанию applecosmetic.firework.<id>,
#                 пустая строка "" делает эффект доступным всем
#   trail       — настройки следа (sprite, size, duration, spacing, spread, spiral, rise, spin,
#                 color, rainbow) — подробно описаны в effects/projectile.yml
#   layers      — необязательно: слои спрайтов на месте взрыва ракеты (параметры — в effects/kill.yml;
#                 точка отсчёта — сама ракета, поэтому y-offset обычно 0)
#   sounds      — необязательно: звуки при взрыве, например
#                 - { name: entity.firework_rocket.twinkle, volume: 0.6, pitch: 1.2 }

# Служебная версия файла — не меняйте. Когда формат обновляется, плагин сохраняет
# прежний файл рядом как firework.yml.vN.bak и кладёт на его место новый.
file-version: 2

effects:
  classic:
    name: "<gradient:#ffe259:#ff5f1f>Праздничная ракета</gradient>"
    icon: "model:applecosmetic:gui/firework_classic"
    lore:
      - "<#b5838a>Золотые искры и яркая вспышка."
    trail: { sprite: [spark_gold, glint_orange, spark_orange], size: "0.3-0.45", duration: 10, spacing: 0.7, spread: 0.08 }
    layers:
      - { animation: POP, sprite: flash_gold, size: 1.8, duration: 7, y-offset: 0 }
      - { animation: SPHERE, sprite: [spark_gold, spark_red, spark_orange], amount: 16, radius: 1.8, size: 0.4, duration: 18, y-offset: 0, fall: 0.6 }

  flame:
    name: "<gradient:#ffb347:#ff5f1f>Огненный хвост</gradient>"
    icon: "model:applecosmetic:gui/firework_flame"
    lore:
      - "<#b5838a>Ракета летит на чистом пламени."
    trail: { sprite: [flame_orange, flame_orange, flame_blood], size: "0.4-0.6", duration: 10, spacing: 0.7, spread: 0.06, rise: -0.2 }
    layers:
      - { animation: POP, sprite: explosion, size: 1.8, duration: 8, y-offset: 0 }
      - { animation: BURST, sprite: [flame_orange, spark_orange], amount: 12, radius: 1.5, size: 0.4, duration: 14, y-offset: 0, fall: 0.5 }

  soul:
    name: "<gradient:#7df9ff:#3aa6b9>Призрачный след</gradient>"
    icon: "model:applecosmetic:gui/firework_soul"
    lore:
      - "<#b5838a>За ракетой летят неприкаянные души."
    trail: { sprite: [wisp_teal, flame_teal, glint_teal], size: "0.35-0.5", duration: 12, spacing: 0.8, spread: 0.1, rise: 0.3 }
    layers:
      - { animation: POP, sprite: skull_teal, size: 1.1, duration: 12, y-offset: 0 }
      - { animation: SPHERE, sprite: [wisp_teal, glint_teal], amount: 12, radius: 1.5, size: 0.4, duration: 16, y-offset: 0 }

  love:
    name: "<gradient:#ff8fab:#ff2e4d>Валентинка</gradient>"
    icon: "model:applecosmetic:gui/firework_love"
    lore:
      - "<#b5838a>Ракета, запущенная от всего сердца."
    trail: { sprite: [heart_red, heart_pink], size: "0.32-0.45", duration: 12, spacing: 0.9, spread: 0.1, rise: 0.2 }
    layers:
      - { animation: POP, sprite: heart_red, size: 1.4, duration: 12, y-offset: 0 }
      - { animation: SPHERE, sprite: [heart_pink, heart_red, glint_pink], amount: 14, radius: 1.6, size: 0.35, duration: 18, y-offset: 0, fall: 0.5 }

  stars:
    name: "<gradient:#ffffff:#ffe9a8>Звездопад</gradient>"
    icon: "model:applecosmetic:gui/firework_stars"
    lore:
      - "<#b5838a>Звёзды сыплются с неба вслед за ракетой."
    trail: { sprite: [star_gold, star_white, glint_gold], size: "0.3-0.45", duration: 12, spacing: 0.7, spiral: 0.3, spin: 10, rise: -0.4 }
    layers:
      - { animation: POP, sprite: star_gold, size: 1.3, duration: 10, y-offset: 0, spin: 8 }
      - { animation: SPHERE, sprite: [star_gold, star_white, glint_white], amount: 14, radius: 1.8, size: 0.38, duration: 18, y-offset: 0, fall: 0.8, spin: 12 }

  rainbow:
    name: "<rainbow>Радуга</rainbow>"
    icon: "model:applecosmetic:gui/firework_rainbow"
    lore:
      - "<#b5838a>След переливается всеми цветами."
    trail: { sprite: orb_white, rainbow: true, size: 0.36, duration: 14, spacing: 0.45 }
    layers:
      - { animation: POP, sprite: flash_white, rainbow: true, size: 1.6, duration: 7, y-offset: 0 }
      - { animation: SPHERE, sprite: spark_white, rainbow: true, amount: 18, radius: 1.8, size: 0.4, duration: 18, y-offset: 0, fall: 0.5 }

  frost:
    name: "<gradient:#e0f7ff:#7de8ff>Снежная ракета</gradient>"
    icon: "model:applecosmetic:gui/firework_frost"
    lore:
      - "<#b5838a>За ней начинается метель."
    trail: { sprite: [snow_ice, snow_white, shard_ice], size: "0.32-0.45", duration: 12, spacing: 0.8, spread: 0.12, rise: -0.4, spin: 6 }
    layers:
      - { animation: POP, sprite: flash_ice, size: 1.6, duration: 7, y-offset: 0 }
      - { animation: SPHERE, sprite: [snow_ice, shard_ice, snow_white], amount: 14, radius: 1.7, size: 0.38, duration: 18, y-offset: 0, fall: 0.9, spin: 8 }

  sakura:
    name: "<gradient:#ffd1dc:#ff8fab>Сакура</gradient>"
    icon: "model:applecosmetic:gui/firework_sakura"
    lore:
      - "<#b5838a>Лепестки кружатся там, где пролетела ракета."
    trail: { sprite: [petal_pink, petal_white], size: "0.32-0.42", duration: 14, spacing: 0.8, spread: 0.12, rise: -0.5, spin: 8 }
    layers:
      - { animation: POP, sprite: sakura, size: 1.4, duration: 12, y-offset: 0, spin: 4 }
      - { animation: SPHERE, sprite: [petal_pink, petal_white], amount: 14, radius: 1.6, size: 0.36, duration: 20, y-offset: 0, fall: 1.0, spin: 10 }

  melody:
    name: "<gradient:#a8ff78:#78ffd6>Дискотека</gradient>"
    icon: "model:applecosmetic:gui/firework_melody"
    lore:
      - "<#b5838a>Ракета летит под музыку."
    trail: { sprite: [note_pink, note2_teal, note_gold, note2_lime, note_purple, note2_blue], size: 0.42, duration: 12, spacing: 1.0, spread: 0.12, rise: 0.3 }
    layers:
      - { animation: SPHERE, sprite: [note_pink, note2_teal, note_gold, note2_purple], amount: 12, radius: 1.6, size: 0.42, duration: 18, y-offset: 0 }
      - { animation: WAVE, sprite: halo_pink, amount: 2, size: 2.4, duration: 10, interval: 4, y-offset: 0 }

  emerald:
    name: "<gradient:#a8ff78:#17c964>Изумрудная</gradient>"
    icon: "model:applecosmetic:gui/firework_emerald"
    lore:
      - "<#b5838a>Сыплет драгоценными камнями."
    trail: { sprite: [gem_green, glint_lime, spark_green], size: "0.3-0.42", duration: 11, spacing: 0.8, spread: 0.08, rise: -0.3 }
    layers:
      - { animation: POP, sprite: flash_green, size: 1.6, duration: 7, y-offset: 0 }
      - { animation: SPHERE, sprite: [gem_green, gem_teal, spark_lime], amount: 14, radius: 1.6, size: 0.36, duration: 18, y-offset: 0, fall: 1.0 }

  shock:
    name: "<gradient:#fff59d:#ffd54f>Грозовая</gradient>"
    icon: "model:applecosmetic:gui/firework_shock"
    lore:
      - "<#b5838a>Искрит и трещит на лету."
    trail: { sprite: [bolt_gold, bolt_white, glint_gold], size: "0.35-0.5", duration: 7, spacing: 0.7, spread: 0.15 }
    layers:
      - { animation: POP, sprite: flash_gold, size: 1.8, duration: 6, y-offset: 0 }
      - { animation: BURST, sprite: [bolt_gold, bolt_white], amount: 12, radius: 1.7, size: 0.45, duration: 10, y-offset: 0, spin: 20 }

  void:
    name: "<gradient:#c77dff:#5a189a>Бездна</gradient>"
    icon: "model:applecosmetic:gui/firework_void"
    lore:
      - "<#b5838a>Ракета оставляет разрыв в пространстве."
    trail: { sprite: [orb_purple, orb_ink, glint_purple], size: "0.3-0.45", duration: 12, spacing: 0.7, spread: 0.06 }
    layers:
      - { animation: POP, sprite: portal_big, size: 2.0, duration: 16, y-offset: 0, spin: 18 }
      - { animation: IMPLODE, sprite: [spark_purple, dot_purple, glint_pink], amount: 14, radius: 1.9, size: 0.34, duration: 12, y-offset: 0 }

  confetti:
    name: "<rainbow>Конфетти</rainbow>"
    icon: "model:applecosmetic:gui/firework_confetti"
    lore:
      - "<#b5838a>Праздник там, где вы пролетели."
    trail: { sprite: [confetti_red, confetti_gold, confetti_green, confetti_blue, confetti_pink, strip_purple, strip_teal], size: "0.3-0.42", duration: 14, spacing: 0.6, spread: 0.15, rise: -0.6, spin: 16 }
    layers:
      - { animation: SPHERE, sprite: [confetti_red, confetti_gold, confetti_green, confetti_blue, strip_pink, strip_teal, strip_gold], amount: 20, radius: 1.8, size: 0.38, duration: 22, y-offset: 0, fall: 1.4, spin: 18 }

  skull:
    name: "<gradient:#f2efe4:#bdb7a4>Весёлый Роджер</gradient>"
    icon: "model:applecosmetic:gui/firework_skull"
    lore:
      - "<#b5838a>Пиратский салют: череп и кости."
    trail: { sprite: [bone, dot_white, glint_white], size: "0.3-0.45", duration: 11, spacing: 0.9, spread: 0.08, spin: 14 }
    layers:
      - { animation: POP, sprite: bones, size: 1.8, duration: 16, y-offset: 0 }
      - { animation: SPHERE, sprite: [bone, dot_white], amount: 12, radius: 1.7, size: 0.4, duration: 16, y-offset: 0, fall: 0.8, spin: 16 }
